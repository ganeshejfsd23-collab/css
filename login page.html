<!DOCTYPE html>
<html>
<head>
  <title>Login Page</title>

  <!--  External CSS -->
  <link rel="stylesheet" href="style.css">

  <!--  Internal CSS -->
  <style>
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .login-box {
      background: rgb(184, 152, 104);
      padding: 25px;
      border-radius: 8px;
      width: 300px;
      text-align: center;
    }
  </style>
</head>

<body>
     
  <div class="login-box">
    <h2>Login</h2>
    <form>

    <!--  Inline CSS -->
    <input 
      type="text" 
      placeholder="Username" 
      style="border: 2px solid green;"
    >

    <input 
      type="password" 
      placeholder="Password" 
      style="border: 2px solid red;"
    >

    <button>Login</button>
    </form>
  </div>

</body>
</html>
