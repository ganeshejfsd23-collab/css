<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Box Model Layout Example</title>
  <style>
    /* Universal selector */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Type selector */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      line-height: 1.6;
    }

    /* Header styling */
    header {
      background: #27d383;
      color: #fff;
      padding: 20px;
      text-align: center;
    }

    /* Descendant combinator: header h1 inside header */
    header h1 {
      font-size: 2rem;
    }

    /* Child combinator: direct child nav of header */
    header > nav {
      margin-top: 10px;
    }

    /* Adjacent sibling combinator: style first section after header */
    header + section {
      background: #fff;
      padding: 20px;
    }

    /* General sibling combinator: all sections after aside */
    aside ~ section {
      border: 1px solid #ddd;
      margin: 10px;
      padding: 15px;
    }

    /* Card styling */
    .card {
      background: #35c81bb0;
      border: 1px solid #ccc;
      padding: 15px;
      margin: 10px;
      border-radius: 5px;
      width: 250px;
      display: inline-block;
      vertical-align: top;
    }

    /* Class selector with descendant combinator */
    .card p {
      color: #0f66df;
    }

    /* ID selector */
    #sidebar {
      background: #25989c;
      padding: 20px;
      width: 200px;
      height:350px;
      float: right;
    }

    /* Footer styling */
    footer {
      background: #6354c4;
      color: #fff;
      text-align: center;
      padding: 15px;
      clear: both;
    }
  </style>
</head>
<body>
  <header>
    <h1>My Website</h1>
    <nav>
      <a href="#">Home</a> | <a href="#">About</a> | <a href="#">Contact</a>
    </nav>
  </header>

  <aside id="sidebar">
    <h2>Sidebar</h2>
    <p>Useful links and info here.</p>
  </aside>

  <section>
    <h2>Featured Cards</h2>
    <div class="card">
      <h3>Card 1</h3>
      <p>This is the first card.</p>
    </div>
    <div class="card">
      <h3>Card 2</h3>
      <p>This is the second card.</p>
    </div>
    <div class="card">
      <h3>Card 3</h3>
      <p>This is the third card.</p>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 My Website</p>
  </footer>
</body>
</html>
