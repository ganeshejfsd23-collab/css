<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Animations Enhanced</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
    }

    .box {
      width: 120px;
      height: 120px;
      margin: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }

    /* 1. Fade In with Delay */
    .fade {
      background: #3498db;
      animation: fadeIn 3s ease-in-out forwards;
      animation-delay: 2s; /* Delay before starting */
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Hover effect: fade out */
    .fade:hover {
      animation: fadeOut 2s ease-in-out forwards;
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0.2; }
    }

    /* 2. Slide with Direction */
    .slide {
      background: #e67e22;
      animation: slideRight 3s ease-in-out infinite alternate-reverse;
      /* direction: alternate-reverse */
    }
    @keyframes slideRight {
      from { transform: translateX(0); }
      to { transform: translateX(150px); }
    }

    /* Hover effect: slide faster */
    .slide:hover {
      animation-duration: 1s;
    }

    /* 3. Bounce */
    .bounce {
      background: #2ecc71;
      animation: bounceUp 2s ease infinite;
    }
    @keyframes bounceUp {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-50px); }
    }

    /* Hover effect: bounce higher */
    .bounce:hover {
      animation: bounceUpHover 1s ease infinite;
    }
    @keyframes bounceUpHover {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-80px); }
    }

    /* 4. Rotate Loader */
    .rotate {
      background: #9b59b6;
      border-radius: 50%;
      border: 6px solid #fff;
      border-top: 6px solid #333;
      animation: spinLoader 2s linear infinite;
    }
    @keyframes spinLoader {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Hover effect: pause loader */
    .rotate:hover {
      animation-play-state: paused;
    }

    /* 5. Scale */
    .scale {
      background: #1abc9c;
      animation: scaleUp 2s ease-in-out infinite alternate;
    }
    @keyframes scaleUp {
      from { transform: scale(1); }
      to { transform: scale(1.5); }
    }

    /* Hover effect: shrink */
    .scale:hover {
      transform: scale(0.8);
    }

    /* 6. Color Change */
    .color {
      background: #e74c3c;
      animation: colorShift 5s linear infinite;
    }
    @keyframes colorShift {
      0% { background: #e74c3c; }
      25% { background: #f1c40f; }
      50% { background: #2ecc71; }
      75% { background: #3498db; }
      100% { background: #e74c3c; }
    }

    /* Hover effect: freeze color */
    .color:hover {
      animation-play-state: paused;
    }

    /* 7. Combined Animation */
    .combo {
      background: #34495e;
      animation: comboAnim 6s ease-in-out infinite;
    }
    @keyframes comboAnim {
      0% { transform: translateX(0) scale(1); opacity: 0.2; }
      25% { transform: translateX(50px) scale(1.2); opacity: 0.5; }
      50% { transform: translateX(100px) scale(1.5); opacity: 1; }
      75% { transform: translateX(50px) scale(1.2); opacity: 0.5; }
      100% { transform: translateX(0) scale(1); opacity: 0.2; }
    }

    /* Hover effect: reverse direction */
    .combo:hover {
      animation-direction: reverse;
    }
  </style>
</head>
<body>
  <div class="box fade">Fade</div>
  <div class="box slide">Slide</div>
  <div class="box bounce">Bounce</div>
  <div class="box rotate">Loader</div>
  <div class="box scale">Scale</div>
  <div class="box color">Color</div>
  <div class="box combo">Combo</div>
</body>
</html>
