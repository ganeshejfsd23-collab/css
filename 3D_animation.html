<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Cube Animation</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #222;
    }

    .scene {
      width: 200px;
      height: 200px;
      perspective: 600px; /* gives depth */
    }

    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: rotateCube 6s infinite linear;
    }

    .face {
      position: absolute;
      width: 200px;
      height: 200px;
      background: rgba(255, 255, 255, 0.8);
      border: 2px solid #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      font-weight: bold;
      color: #000;
    }

    /* Position each face in 3D space */
    .front  { transform: rotateY(0deg) translateZ(100px); background: #e74c3c; }
    .back   { transform: rotateY(180deg) translateZ(100px); background: #3498db; }
    .right  { transform: rotateY(90deg) translateZ(100px); background: #2ecc71; }
    .left   { transform: rotateY(-90deg) translateZ(100px); background: #f1c40f; }
    .top    { transform: rotateX(90deg) translateZ(100px); background: #9b59b6; }
    .bottom { transform: rotateX(-90deg) translateZ(100px); background: #1abc9c; }

    /* Animation keyframes */
    @keyframes rotateCube {
      from { transform: rotateX(0deg) rotateY(0deg); }
      to   { transform: rotateX(360deg) rotateY(360deg); }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="cube">
      <div class="face front">Front</div>
      <div class="face back">Back</div>
      <div class="face right">Right</div>
      <div class="face left">Left</div>
      <div class="face top">Top</div>
      <div class="face bottom">Bottom</div>
    </div>
  </div>
</body>
</html>
